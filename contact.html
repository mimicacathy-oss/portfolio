<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CATHY | Creative Design Studio</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <div class="logo">CATHY</div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>
<body>

  <!-- Header loaded via JS -->

  <section class="contact">
    <div class="container contact-content">
      <div class="contact-text">
        <h1 class="section-title">Let’s Talk!</h1>
        <p>Have a project in mind? Drop me a message and let’s create something amazing.</p>
        <form class="contact-form">
          <input type="text" placeholder="Your Name" required />
          <input type="email" placeholder="Your Email" required />
          <textarea placeholder="Your Message" rows="6" required></textarea>
          <button type="submit" class="btn">Send Message</button>
        </form>
      </div>
      <div class="contact-illustration">
        <img src="hand-drawn-people-talking-phone-illustration.png" alt="Let’s Talk" class="float" />
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
